<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TP3 — Procesamiento Digital de Señales</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>TP3 — Procesamiento Digital de Señales</h1>
<div class="subtitle">ESP32 · Muestreo y visualización en tiempo real</div>

<div class="panel">
  <div class="controls">
    <button id="connectBtn">Conectar ESP32</button>
    <button id="startBtn" disabled>Iniciar muestreo</button>
    <button id="stopBtn" disabled>Detener muestreo</button>
    <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Desconectado</span></div>
  </div>
  <div class="controls" style="margin-top:10px;">
    <label for="rateInput">Frecuencia de muestreo (Hz):</label>
    <input type="number" id="rateInput" value="1000" min="10" max="5000">
    <button id="rateBtn" disabled>Aplicar</button>
  </div>
</div>

<div class="panel">
  <canvas id="scope"></canvas>
  <div class="readouts">
    <div class="readout"><div class="label">Último valor</div><div class="value" id="rLast">—</div></div>
    <div class="readout"><div class="label">Mínimo</div><div class="value" id="rMin">—</div></div>
    <div class="readout"><div class="label">Máximo</div><div class="value" id="rMax">—</div></div>
    <div class="readout"><div class="label">Amplitud (Vpp digital)</div><div class="value" id="rVpp">—</div></div>
    <div class="readout"><div class="label">Muestras</div><div class="value" id="rCount">—</div></div>
  </div>
</div>

<div class="panel">
  <div class="label" style="color:var(--text-dim); font-size:11px; margin-bottom:6px;">Consola serie</div>
  <div id="log"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
